<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

                 img-src 'self' data:;

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #1b2b4e 0%, #2a4a6e 50%, #1f3a5a 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f0f7ff;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "❄️ ❅ ❆ ❄️ ❅ ❆ ❄️ ❅ ❆";
      position: absolute;
      top: 10px; left: 0;
      width: 100%;
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.08);
      letter-spacing: 3rem;
      white-space: nowrap;
      pointer-events: none;
      animation: drift 40s linear infinite;
      z-index: 0;
    }

    @keyframes drift {
      0% { transform: translateX(-10%); }
      100% { transform: translateX(10%); }
    }

    .app { max-width: 1300px; width: 100%; position: relative; z-index: 2; }

    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      padding: 1.8rem 2rem;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .glass-panel:hover {
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), inset 0 1px 3px rgba(255, 255, 255, 0.2);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding: 1rem 1.8rem;
    }

    .logo h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #c0e0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo i { font-size: 2.4rem; color: #b3e0ff; filter: drop-shadow(0 0 6px #8ac8ff); }

    .nav-buttons { display: flex; gap: 0.8rem; flex-wrap: wrap; }

    .glass-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 3rem;
      padding: 0.7rem 1.4rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: #e6f2ff;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.2px;
      text-decoration: none;
    }

    .glass-btn i { font-size: 1rem; }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      color: white;
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
    }

    .glass-btn:active { transform: scale(0.98); }

    .glass-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(180, 220, 255, 0.5);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3rem;
      padding: 0.2rem 0.2rem 0.2rem 1.4rem;
      flex: 1;
      min-width: 220px;
      transition: all 0.2s;
    }

    .search-wrapper:focus-within {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px rgba(180, 220, 255, 0.3);
    }

    .search-wrapper i { color: #b0d0ff; font-size: 1rem; }

    .search-wrapper input {
      background: transparent;
      border: none;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      color: white;
      width: 100%;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .search-wrapper input::placeholder {
      color: rgba(220, 240, 255, 0.6);
      font-weight: 400;
    }

    .filter-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2.5rem;
      padding: 0.7rem 1.3rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #d0e4ff;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      color: white;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.8);
      color: white;
      box-shadow: 0 0 15px rgba(180, 220, 255, 0.4);
    }

    .sports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.6rem;
      margin-bottom: 2.5rem;
    }

    .sport-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 1.8rem;
      padding: 1.5rem 1.5rem 1.3rem;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .sport-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 22px 35px -8px rgba(0, 0, 0, 0.5);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      color: #c0e0ff;
      filter: drop-shadow(0 0 8px rgba(150, 200, 255, 0.6));
    }

    .sport-card h3 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .sport-card p {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #d3e5ff;
      flex: 1;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .card-meta {
      font-size: 0.78rem;
      color: #a8c8ff;
      margin-bottom: 0.8rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .card-meta span {
      background: rgba(255,255,255,0.07);
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.9rem;
      margin-top: 0.2rem;
    }

    .olympic-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.8rem;
      border-radius: 2rem;
      background: rgba(255, 215, 0, 0.15);
      color: #ffd966;
      border: 1px solid rgba(255, 215, 0, 0.3);
      letter-spacing: 0.3px;
    }

    .detail-btn {
      background: transparent;
      border: none;
      color: #b8d8ff;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.2s;
      padding: 0.2rem 0.6rem;
      border-radius: 50%;
    }

    .detail-btn:hover {
      color: white;
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.1);
    }

    .info-panel {
      margin-top: 1.5rem;
      padding: 1.8rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 2rem;
      transition: all 0.3s ease;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .info-panel.hidden { display: none; }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .info-header h2 {
      font-size: 1.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .close-info {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .close-info:hover {
      background: rgba(255, 80, 80, 0.5);
      border-color: #ff9f9f;
    }

    .info-content p {
      font-size: 1rem;
      line-height: 1.7;
      color: #e2eeff;
      margin-bottom: 0.9rem;
    }

    .info-content h4 {
      color: #b8d8ff;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-size: 1.05rem;
    }

    .info-content ul {
      margin-left: 1.5rem;
      color: #d0e4ff;
      margin-bottom: 0.9rem;
    }

    .info-content li { margin-bottom: 0.4rem; }

    .info-content .fact-box {
      background: rgba(255,255,255,0.06);
      border-left: 3px solid #8ac8ff;
      padding: 0.8rem 1rem;
      border-radius: 0.8rem;
      margin-top: 1rem;
      font-size: 0.92rem;
      color: #c8deff;
    }

    .footer-note {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(210, 230, 255, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.8rem;
      letter-spacing: 0.3px;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #90ee90;
      margin-top: 0.5rem;
    }

    @media (max-width: 650px) {
      body { padding: 1rem; }
      .glass-panel { padding: 1.2rem; }
      header { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .logo h1 { font-size: 1.7rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .sports-grid { grid-template-columns: 1fr; }
      .info-header h2 { font-size: 1.4rem; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>

    <div class="footer-note">

      <div class="security-badge"><i class="fas fa-shield-halved"></i> Защищено: CSP, XSS-фильтрация, sanitize ввода</div>

  <script>
    "use strict";
    (function() {
      // ============ ЗАЩИТА: ЭКРАНИРОВАНИЕ ============
      // Экранирует HTML-спецсимволы — защита от XSS при выводе данных.
      function escapeHTML(str) {
        if (typeof str !== 'string') return '';
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;',
          '/': '&#x2F;',
          '`': '&#x60;',
          '=': '&#x3D;'
        };
        return str.replace(/[&<>"'`=\/]/g, function(s) { return map[s]; });
      }

      // Очистка пользовательского ввода перед использованием в поиске
      function sanitizeInput(str) {
        if (typeof str !== 'string') return '';
        // Убираем потенциально опасные конструкции
        return str
          .slice(0, 100)
          .replace(/<[^>]*>/g, '')
          .replace(/[<>"'`]/g, '')
          .trim()
          .toLowerCase();
      }

      // Безопасное создание элемента через textContent
      function safeText(el, text) {
        el.textContent = String(text);
      }

        {

          full: 'Фристайл включает дисциплины: могул, парный могул, ски-кросс, слоупстайл, хафпайп, биг-эйр. Очень зрелищный и динамичный вид.',

        },
        {

          facts: 'Самая высокая скорость — 130 км/ч. Трасса в Солт-Лейк-Сити имеет уклон до 40%.',
          olympicDetails: 'Дисциплины: мужской и женский турниры.'
        },
        {
          id: 11, name: 'Лыжные гонки', category: 'лыжи', olympic: true, icon: 'fa-skiing-nordic',
          short: 'Гонки на лыжах по пересечённой местности классическим и свободным стилем.',
          full: 'Лыжные гонки — один из самых массовых зимних видов. Включает индивидуальные гонки, скиатлон, эстафеты, спринт. Проводятся классическим и свободным стилем.',
          history: 'Зародились в Скандинавии. Олимпийский вид с 1924 года (Шамони).',
          rules: 'Побеждает лучший по времени. В спринте — отборочные забеги, затем финалы.',
          equipment: 'Лыжи, палки, ботинки, мазь для скольжения.',
          facts: 'Самая длинная гонка — 50 км у мужчин (классика). Марафон — 70 км и более.',
          olympicDetails: 'Дисциплины: спринт, командный спринт, скиатлон, эстафета, масс-старт.'
        },
        {
          id: 12, name: 'Шорт-трек', category: 'коньки', olympic: true, icon: 'fa-person-skating',
          short: 'Скоростной бег на коньках по короткой дорожке внутри хоккейной площадки.',
          full: 'Шорт-трек — гонки на коньках по овальной дорожке 111,12 м. Включает дистанции 500, 1000, 1500, 3000 м и эстафеты. Очень тактический вид.',
          history: 'Зародился в Канаде в 1900-х. Олимпийский вид с 1992 года (Альбервиль).',
          rules: 'Запрещены толчки и блокировки. За нарушение — дисквалификация.',
          equipment: 'Коньки с длинным лезвием, шлем, защитные очки, перчатки.',
          facts: 'Скорость достигает 50 км/ч. На поворотах спортсмены касаются льда рукой.',
          olympicDetails: 'Дисциплины: 500 м, 1000 м, 1500 м, эстафета 3000 м (жен) и 5000 м (муж).'
        }
      ];

      // ============ СОСТОЯНИЕ ============
      let currentFilter = 'all';
      let searchQuery = '';
      let isOlympicFilter = false;

      // ============ DOM ============
      const sportsGrid = document.getElementById('sportsGrid');
      const infoPanel = document.getElementById('infoPanel');
      const infoTitle = document.getElementById('infoTitle');
      const infoContent = document.getElementById('infoContent');
      const closeInfoBtn = document.getElementById('closeInfoBtn');
      const searchInput = document.getElementById('searchInput');
      const filterContainer = document.getElementById('filterContainer');

      // ============ ОТРИСОВКА ============
      function renderSports() {
        let list = sportsData.slice();

        if (currentFilter !== 'all') {
          list = list.filter(s => s.category === currentFilter);
        }

        if (isOlympicFilter) {
          list = list.filter(s => s.olympic === true);
        }

        if (searchQuery) {
          list = list.filter(s =>
            s.name.toLowerCase().includes(searchQuery) ||
            s.short.toLowerCase().includes(searchQuery) ||
            s.category.toLowerCase().includes(searchQuery)
          );
        }

        sportsGrid.innerHTML = '';

        if (list.length === 0) {
          const noResult = document.createElement('div');
          noResult.className = 'glass-panel';
          noResult.style.gridColumn = '1 / -1';
          noResult.style.textAlign = 'center';
          noResult.style.padding = '2.5rem';
          safeText(noResult, '😕 Ничего не найдено. Попробуйте другой запрос.');
          sportsGrid.appendChild(noResult);
          return;
        }

        list.forEach(sport => {
          const card = document.createElement('div');
          card.className = 'sport-card';
          card.setAttribute('data-id', sport.id);

          // Иконка
          const icon = document.createElement('i');
          icon.className = `fas ${sport.icon} card-icon`;
          card.appendChild(icon);

          // Название (безопасно)
          const h3 = document.createElement('h3');
          safeText(h3, sport.name);
          card.appendChild(h3);

          // Метаданные
          const meta = document.createElement('div');
          meta.className = 'card-meta';
          const catSpan = document.createElement('span');
          safeText(catSpan, `#${sport.category}`);
          meta.appendChild(catSpan);
          const idSpan = document.createElement('span');
          safeText(idSpan, `ID: ${sport.id}`);
          meta.appendChild(idSpan);
          card.appendChild(meta);

          // Краткое описание
          const p = document.createElement('p');
          safeText(p, sport.short);
          card.appendChild(p);

          // Футер
          const footer = document.createElement('div');
          footer.className = 'card-footer';

          const badge = document.createElement('span');
          badge.className = 'olympic-badge';
          safeText(badge, sport.olympic ? '🏅 Олимпийский' : '❄️ Неолимпийский');
          footer.appendChild(badge);

          const detailBtn = document.createElement('button');
          detailBtn.className = 'detail-btn';
          detailBtn.setAttribute('aria-label', 'Подробнее');
          detailBtn.innerHTML = '<i class="fas fa-arrow-right"></i>';
          detailBtn.addEventListener('click', () => showInfo(sport.id));
          footer.appendChild(detailBtn);

          card.appendChild(footer);
          sportsGrid.appendChild(card);
        });
      }

      // ============ ПОКАЗ ИНФОРМАЦИИ (БЕЗОПАСНО) ============
      function showInfo(id) {
        const sport = sportsData.find(s => s.id === id);
        if (!sport) return;

        // Заголовок
        infoTitle.innerHTML = `<i class="fas ${sport.icon}"></i> `;
        const titleText = document.createTextNode(sport.name);
        infoTitle.appendChild(titleText);

        // Контент
        infoContent.innerHTML = '';

        const addPara = (text) => {
          const p = document.createElement('p');
          safeText(p, text);
          infoContent.appendChild(p);
        };

        addPara(sport.full);

        const addHeading = (text) => {
          const h4 = document.createElement('h4');
          safeText(h4, text);
          infoContent.appendChild(h4);
        };

        const addList = (items) => {
          const ul = document.createElement('ul');
          items.forEach(item => {
            const li = document.createElement('li');
            safeText(li, item);
            ul.appendChild(li);
          });
          infoContent.appendChild(ul);
        };

        addHeading('📜 История');
        addPara(sport.history);

        addHeading('📋 Правила');
        addPara(sport.rules);

        addHeading('🎿 Экипировка');
        addPara(sport.equipment);

        addHeading('🏅 Олимпийские дисциплины');
        addPara(sport.olympicDetails);

        // Факт-бокс
        const factBox = document.createElement('div');
        factBox.className = 'fact-box';
        const factLabel = document.createElement('strong');
        safeText(factLabel, '💡 Интересный факт: ');
        factBox.appendChild(factLabel);
        factBox.appendChild(document.createTextNode(sport.facts));
        infoContent.appendChild(factBox);

        infoPanel.classList.remove('hidden');
        infoPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // ============ ФИЛЬТРЫ ============
      function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        renderSports();
      }

      // ============ СОБЫТИЯ ============
      filterContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        setFilter(btn.dataset.filter);
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = sanitizeInput(e.target.value);
        renderSports();
      });

      closeInfoBtn.addEventListener('click', () => {
        infoPanel.classList.add('hidden');
      });

      document.getElementById('homeBtn').addEventListener('click', () => {
        currentFilter = 'all';
        searchQuery = '';
        isOlympicFilter = false;
        searchInput.value = '';
        setFilter('all');
        infoPanel.classList.add('hidden');
      });

      document.getElementById('randomSportBtn').addEventListener('click', () => {
        const random = sportsData[Math.floor(Math.random() * sportsData.length)];
        showInfo(random.id);
      });

      document.getElementById('olympicFilterBtn').addEventListener('click', () => {
        isOlympicFilter = !isOlympicFilter;
        document.getElementById('olympicFilterBtn').classList.toggle('active', isOlympicFilter);
        renderSports();
      });

      document.getElementById('statsBtn').addEventListener('click', () => {
        const total = sportsData.length;
        const olympicCount = sportsData.filter(s => s.olympic).length;
        const categories = [...new Set(sportsData.map(s => s.category))];

        infoTitle.innerHTML = '<i class="fas fa-chart-simple"></i> Статистика';
        infoContent.innerHTML = '';

        const p1 = document.createElement('p');
        safeText(p1, `Всего видов спорта в базе: ${total}`);
        infoContent.appendChild(p1);

        const p2 = document.createElement('p');
        safeText(p2, `Олимпийских видов: ${olympicCount}`);
        infoContent.appendChild(p2);

        const p3 = document.createElement('p');
        safeText(p3, `Категории: ${categories.join(', ')}`);
        infoContent.appendChild(p3);

        const h4 = document.createElement('h4');
        safeText(h4, 'Распределение по категориям:');
        infoContent.appendChild(h4);

        const ul = document.createElement('ul');
        categories.forEach(cat => {
          const count = sportsData.filter(s => s.category === cat).length;
          const li = document.createElement('li');
          safeText(li, `${cat}: ${count}`);
          ul.appendChild(li);
        });
        infoContent.appendChild(ul);

        infoPanel.classList.remove('hidden');
      });

      // ============ ИНИЦИАЛИЗАЦИЯ ============
      renderSports();
    })();
  </script>
</body>
</html>
